<!doctype html>
<!--
  Dev-only preview: the web build inside an Android phone frame.
  Served from the same Metro origin on purpose — expo-sqlite needs a
  cross-origin-isolated page, and an iframe only gets that when its parent
  is same-origin and isolated too (metro.config.js sets the headers).
-->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Repz · Handy-Vorschau</title>
    <style>
      :root {
        --screen-w: 412px;
        --screen-h: 915px;
        --bezel: 12px;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(circle at 50% 30%, #23263a, #0b0d14 70%);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #c7c9d3;
        overflow: hidden;
      }
      .stage { transform-origin: center center; }
      .phone {
        position: relative;
        width: calc(var(--screen-w) + 2 * var(--bezel));
        height: calc(var(--screen-h) + 2 * var(--bezel));
        padding: var(--bezel);
        border-radius: 52px;
        background: #111318;
        box-shadow:
          0 0 0 2px #2c2f3a,
          0 0 0 4px #0a0b0f,
          0 40px 80px rgba(0, 0, 0, 0.6);
      }
      /* Side buttons: power + volume rocker, right edge like a Pixel. */
      .phone::before, .phone::after {
        content: '';
        position: absolute;
        right: -6px;
        width: 4px;
        border-radius: 0 3px 3px 0;
        background: #2c2f3a;
      }
      .phone::before { top: 170px; height: 70px; }
      .phone::after { top: 270px; height: 130px; }
      .screen {
        position: relative;
        width: var(--screen-w);
        height: var(--screen-h);
        border-radius: 40px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background: #0b0d14;
      }
      .statusbar {
        height: 32px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 26px;
        font-size: 14px;
        font-weight: 500;
        color: #f4f5f7;
        position: relative;
      }
      .camera {
        position: absolute;
        left: 50%;
        top: 9px;
        width: 14px;
        height: 14px;
        margin-left: -7px;
        border-radius: 50%;
        background: #000;
        box-shadow: 0 0 0 2px #1b1d24;
      }
      .icons { display: flex; gap: 6px; align-items: center; }
      .icons svg { width: 16px; height: 16px; fill: currentColor; }
      iframe { flex: 1; width: 100%; border: 0; display: block; background: #0b0d14; }
      .navbar {
        height: 22px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .navbar span { width: 110px; height: 4px; border-radius: 2px; background: #f4f5f7; opacity: 0.85; }
      .controls { display: flex; gap: 10px; font-size: 13px; }
      .controls button {
        font: inherit;
        color: inherit;
        background: #1b1e2b;
        border: 1px solid #2c2f3a;
        border-radius: 999px;
        padding: 6px 14px;
        cursor: pointer;
      }
      .controls button:hover { border-color: #6366f1; }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="phone">
        <div class="screen">
          <div class="statusbar">
            <span id="clock">--:--</span>
            <div class="camera"></div>
            <div class="icons" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 21 0 8a17 17 0 0 1 24 0z" /></svg>
              <svg viewBox="0 0 24 24"><path d="M2 22h3V18H2zm5 0h3V14H7zm5 0h3V9h-3zm5 0h3V3h-3z" /></svg>
              <svg viewBox="0 0 24 24"><path d="M16 4h-2V2h-4v2H8a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1z" /></svg>
            </div>
          </div>
          <iframe id="app" src="/" title="Repz"></iframe>
          <div class="navbar"><span></span></div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button id="back" type="button">◀ Zurück</button>
      <button id="reload" type="button">↻ Neu laden</button>
      <button id="home" type="button">● Start</button>
    </div>
    <script>
      const app = document.getElementById('app');
      const stage = document.getElementById('stage');

      function tick() {
        const now = new Date();
        document.getElementById('clock').textContent =
          String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      }
      tick();
      setInterval(tick, 10000);

      // Shrink the whole phone to fit short laptop screens; never enlarge it.
      function fit() {
        const phoneH = 915 + 24 + 8;
        const scale = Math.min(1, (window.innerHeight - 70) / phoneH, (window.innerWidth - 32) / (412 + 24 + 8));
        stage.style.transform = 'scale(' + scale + ')';
        stage.style.margin = (-(1 - scale) * phoneH) / 2 + 'px 0';
      }
      fit();
      window.addEventListener('resize', fit);

      document.getElementById('back').onclick = () => app.contentWindow.history.back();
      document.getElementById('reload').onclick = () => app.contentWindow.location.reload();
      document.getElementById('home').onclick = () => { app.src = '/'; };
    </script>
  </body>
</html>
