<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repz Designrichtungen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- page ---------- */
:root{--pg:#0F1013;--pgCard:#17181C;--pgLn:#26272D;--pgTx:#ECEDF0;--pgMu:#8B8D96}
*{box-sizing:border-box}
html,body{margin:0;background:var(--pg);color:var(--pgTx);font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
.pg{max-width:1180px;margin:0 auto;padding:28px 20px 6px}
.pg h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.pg p{margin:6px 0 0;color:var(--pgMu);font-size:14.5px;line-height:1.5;max-width:760px}
.pg .mockTag{display:inline-block;margin-left:8px;padding:3px 8px;border-radius:99px;background:#2A2410;color:#FCD34D;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;vertical-align:4px}
.picker{max-width:1180px;margin:0 auto;padding:16px 20px 4px;display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;overflow-x:auto;scrollbar-width:none}
.picker::-webkit-scrollbar{display:none}
.picker .card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--pgCard);border:1.5px solid var(--pgLn);cursor:pointer;transition:border-color .2s,transform .2s,background .2s}
.picker .card:hover{transform:translateY(-2px);border-color:#3A3C44}
.picker .card.cur{border-color:#ECEDF0;background:#1E1F24}
.picker .sw{display:grid;grid-template-columns:1fr 1fr;width:30px;height:30px;border-radius:8px;overflow:hidden;flex:none}
.picker .sw i{display:block}
.picker .pl{display:block;font-size:11px;font-weight:700;color:var(--pgMu);letter-spacing:.08em}
.picker b{font-size:14px;font-weight:700;white-space:nowrap}
.stage{max-width:1180px;margin:0 auto;padding:18px 20px 60px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:44px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr);justify-items:center;gap:24px}}
.phone-wrap{position:relative}
.phone{position:absolute;top:0;left:0;width:399px;height:836px;padding:12px;border-radius:56px;background:linear-gradient(145deg,#2A2B31,#141518);box-shadow:0 0 0 1.5px #3A3B42,0 40px 80px -30px rgba(0,0,0,.8);transform-origin:top left}
.info{max-width:480px;padding-top:12px}
.info .kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pgMu);margin:0}
.info h2{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:6px 0 8px}
.info .idea{font-size:16px;line-height:1.5;color:#C9CBD2;margin:0 0 18px}
.info ul{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:10px}
.info li{padding:12px 14px;border-radius:12px;background:var(--pgCard);border:1px solid var(--pgLn);font-size:14px;line-height:1.45;color:#C9CBD2}
.info li b{display:block;color:var(--pgTx);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.info .how{font-size:13.5px;line-height:1.55;color:var(--pgMu);border-left:2px solid var(--pgLn);padding-left:12px}
.info .nav{display:flex;gap:10px;margin-top:18px}
.info .nav button{font:600 14px 'Inter Tight',sans-serif;color:var(--pgTx);background:var(--pgCard);border:1px solid var(--pgLn);border-radius:10px;padding:10px 14px;cursor:pointer}
.info .nav button:hover{border-color:#4A4C55}

/* ---------- phone screen (shared) ---------- */
.screen{position:relative;width:375px;height:812px;border-radius:44px;overflow:hidden;isolation:isolate}
.screen button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
.screen h1,.screen p{margin:0}
.ic{display:block;flex:none}
.sb{position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:4px 26px 0 34px;font:600 15px/1 system-ui,sans-serif;z-index:25;pointer-events:none}
.sb .demo{height:30px;min-width:118px;padding:0 14px;border-radius:99px;background:#000;color:#fff;display:grid;place-items:center;font:800 10px/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.sb .sbr{display:flex;gap:6px;align-items:center}
.scrs{position:absolute;inset:0}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:58px 20px 124px;display:none;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr.active{display:block}
.scr[data-s="einheit"]{padding-bottom:200px!important}
.ovls{position:absolute;inset:0;pointer-events:none;z-index:15}
.ovls>*{pointer-events:auto}
.toast{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);padding:10px 16px;border-radius:12px;background:rgba(0,0,0,.88);color:#fff;font:600 13px system-ui,sans-serif;white-space:nowrap;animation:toast 2.4s ease both;z-index:30}
.tk-msg{display:none!important}
[data-banner].taken .tk-msg{display:flex!important}
[data-banner].taken .tk-hide{display:none!important}
.ax{font-size:9.5px;fill:currentColor;opacity:.55}
.scr.in .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s cubic-bezier(.4,0,.2,1) .25s forwards}
.scr.in .areaIn{animation:fadeIn .5s ease .75s both}
.scr.in .fc{animation:fadeIn .55s ease 1s both}
.scr.in .dotIn{animation:popIn .4s cubic-bezier(.34,1.8,.64,1) 1s both;transform-box:fill-box;transform-origin:center}
.scr.in .ring .fil{animation:ringIn var(--ringDur,.95s) cubic-bezier(.2,.8,.2,1) .15s both}
.grow{transform-origin:left center}
.scr.in .grow{animation:grow .75s cubic-bezier(.2,.8,.2,1) .25s both}
@keyframes ringIn{from{stroke-dashoffset:var(--len)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:scale(0)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
@keyframes flick{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.08)}}
@keyframes blink{50%{opacity:0}}
@keyframes shine{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
@keyframes raysOut{from{transform:scale(.3);opacity:1}to{transform:scale(1.15);opacity:0}}
@keyframes burstFade{0%{opacity:0}10%,78%{opacity:1}100%{opacity:0}}

/* =====================  A · Repz Evolved  ===================== */
.dA{--tx:#F3F5F9;--mu:#8A90A6;--bd:rgba(255,255,255,.08);--gl:rgba(255,255,255,.045);--a1:#6366F1;--a2:#8B5CF6;--ok:#3DDC84;--warn:#FBBF24;color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:radial-gradient(420px 320px at 105% -5%,rgba(99,102,241,.34),transparent 62%),radial-gradient(380px 300px at -15% 52%,rgba(139,92,246,.22),transparent 62%),radial-gradient(320px 260px at 95% 102%,rgba(34,211,238,.10),transparent 62%),#0B0D14}
.dA .sb{color:#fff}
.dA .scr.in .st{animation:aUp .4s cubic-bezier(.34,1.4,.64,1) both;animation-delay:calc(var(--d)*60ms)}
@keyframes aUp{from{opacity:0;transform:translateY(16px) scale(.97)}}
.dA .glass{background:var(--gl);border:1px solid var(--bd);border-radius:22px;backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.dA .aHead{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 2px 18px}
.dA .aDate{color:var(--mu);font-size:13px;font-weight:500}
.dA h1{margin-top:2px;font-size:32px;font-weight:800;letter-spacing:-.025em}
.dA .aAv{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 6px 20px -6px rgba(99,102,241,.8)}
.dA .aAv.j{background:linear-gradient(135deg,#14B8A6,#22D3EE);box-shadow:0 6px 20px -6px rgba(34,211,238,.6)}
.dA .ring .trk{stroke:rgba(255,255,255,.07)}
.dA .aHero{display:flex;gap:16px;align-items:center;padding:18px 16px}
.dA .aRingWrap{position:relative;width:146px;height:146px;flex:none}
.dA .aRingIn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dA .aRingIn b{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dA .aRingIn span{font-size:12px;color:var(--mu)}
.dA .aRingIn em{font-style:normal;font-size:11px;color:#A5B4FC;margin-top:3px;font-weight:600}
.dA .aSide{display:flex;flex-direction:column;gap:12px;min-width:0}
.dA .aMini{display:flex;gap:10px;align-items:center}
.dA .aMini b{display:block;font-size:17px;font-weight:800}
.dA .aMini span{font-size:11.5px;color:var(--mu)}
.dA .aStreak{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:7px 10px;border-radius:99px;background:rgba(251,146,60,.13);color:#FDBA74;width:max-content}
.dA .aStreak .ic{color:#FB923C;animation:flick 1.6s ease-in-out infinite}
.dA .aNote{font-size:12px;color:var(--mu);line-height:1.4}
.dA .aNote b{color:var(--tx)}
.dA .aGym{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;margin-top:12px}
.dA .aGymIc{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(99,102,241,.18);color:#A5B4FC;flex:none}
.dA .aGymTx{flex:1;display:flex;flex-direction:column}
.dA .aGymTx b{font-size:15px}
.dA .aGymTx span{font-size:12px;color:var(--mu)}
.dA .aLink{font-size:13px;color:#A5B4FC;font-weight:700}
.dA .aLbl{margin:20px 2px 10px;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.dA .aPlans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dA .aPlan{position:relative;padding:14px 12px;border-radius:18px;background:var(--gl);border:1px solid var(--bd);display:flex;flex-direction:column;gap:2px}
.dA .aPlan b{font-size:16px}
.dA .aPlan span{font-size:11.5px;color:var(--mu)}
.dA .aPlan.on{background:linear-gradient(160deg,rgba(99,102,241,.38),rgba(139,92,246,.16));border-color:rgba(165,180,252,.5)}
.dA .aChk{position:absolute;top:10px;right:10px;width:18px;height:18px;border-radius:50%;background:#fff;color:#4F46E5;display:grid;place-items:center}
.dA .aCta{width:100%;margin-top:20px;height:56px;border-radius:18px;background:linear-gradient(90deg,var(--a1),var(--a2));display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:16px;box-shadow:0 14px 30px -12px rgba(99,102,241,.9);position:relative;overflow:hidden;transition:transform .2s cubic-bezier(.34,1.6,.64,1)}
.dA .aCta:active{transform:scale(.97)}
.dA .aCta::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.4s ease-in-out 1.2s infinite}
.dA .aGhost{width:100%;height:46px;margin-top:8px;border-radius:16px;color:var(--mu);font-weight:700;font-size:14px;text-align:center}
.dA .aLive{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:99px;background:rgba(61,220,132,.12);color:#86EFAC;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.dA .aLive i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.4s infinite}
.dA .aProg{display:flex;align-items:center;gap:12px;margin:-6px 2px 14px;font-size:12px;color:var(--mu);font-weight:600}
.dA .aBarT{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.dA .aBarT i{display:block;height:100%;width:var(--w);border-radius:9px;background:linear-gradient(90deg,var(--a1),var(--a2))}
.dA .aEx{display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:10px}
.dA .aEx>div{flex:1}
.dA .aEx b{display:block;font-size:15px}
.dA .aEx span{font-size:12px;color:var(--mu)}
.dA .aEx>.ic{color:var(--mu)}
.dA .aEx.done b{color:#B5BACB}
.dA .aExOk{width:28px;height:28px;border-radius:50%;background:rgba(61,220,132,.16);color:var(--ok);display:grid;place-items:center;flex:none}
.dA .aExNum{width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(255,255,255,.14);display:grid;place-items:center;font-size:12px!important;font-weight:800;color:var(--mu);flex:none}
.dA .aExOpen{position:relative;padding:16px 14px 10px;margin-bottom:10px;border-color:rgba(165,180,252,.32);background:linear-gradient(180deg,rgba(99,102,241,.14),rgba(255,255,255,.03))}
.dA .aExTop{display:flex;justify-content:space-between;align-items:center}
.dA .aExTop b{font-size:19px;font-weight:800;letter-spacing:-.01em}
.dA .aPR{display:inline-flex;gap:4px;align-items:center;font-size:11px;font-weight:800;padding:5px 9px;border-radius:99px;background:linear-gradient(90deg,#F59E0B,#FBBF24);color:#1A1300;opacity:0;transform:scale(.5);transition:opacity .3s,transform .4s cubic-bezier(.34,1.7,.64,1)}
.dA .hasPR .aPR{opacity:1;transform:none}
.dA .aLast{margin:3px 0 12px;font-size:13px;color:var(--mu)}
.dA .aSetH,.dA .aSet{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;align-items:center}
.dA .aSetH{font-size:10.5px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;padding:0 2px 6px}
.dA .aSet{padding:5px 0}
.dA .aN{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;background:rgba(255,255,255,.06);color:var(--mu)}
.dA .aIn{height:42px;border-radius:12px;background:rgba(8,10,18,.55);border:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;transition:border-color .3s,box-shadow .3s}
.dA .aIn.ph{color:#454B5E}
.dA .aTick{width:42px;height:42px;border-radius:13px!important;border:1.5px solid rgba(255,255,255,.16)!important;display:grid;place-items:center;color:transparent;transition:background .25s,border-color .25s,color .2s}
.dA .aTick .ic{transform:scale(.3);transition:transform .38s cubic-bezier(.34,1.8,.64,1)}
.dA .aSet.on .aTick{background:var(--ok);border-color:var(--ok)!important;color:#06210F}
.dA .aSet.on .aTick .ic{transform:none}
.dA .aSet.on .aIn{border-color:rgba(61,220,132,.28)}
.dA .aSet.pop .aTick{animation:aPop .42s cubic-bezier(.34,1.8,.64,1)}
@keyframes aPop{40%{transform:scale(1.18)}}
.dA .aSet.isPR .aIn{border-color:rgba(251,191,36,.6);box-shadow:0 0 0 3px rgba(251,191,36,.13)}
.dA .aHint{grid-column:2/-1;font-style:normal;font-size:11.5px;color:var(--mu);margin-top:-1px}
.dA .aAdd{margin-top:6px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#A5B4FC;padding:8px 2px}
.dA .aBurst{position:absolute;left:50%;top:-54px;transform:translateX(-50%);pointer-events:none;display:flex;flex-direction:column;align-items:center;opacity:0;z-index:3}
.dA .aBurst span{margin-top:-70px;font-size:12px;font-weight:800;padding:7px 13px;border-radius:99px;background:linear-gradient(90deg,#F59E0B,#FBBF24);color:#1A1300;white-space:nowrap;box-shadow:0 10px 26px -6px rgba(251,191,36,.75)}
.dA .aBurst.show{animation:burstFade 1.9s ease both}
.dA .aBurst.show .rays{animation:raysOut .75s cubic-bezier(.2,.8,.2,1) both}
.dA .aRest{position:absolute;left:16px;right:16px;bottom:100px;display:flex;align-items:center;gap:12px;padding:9px 10px 9px 9px;border-radius:20px;background:rgba(21,25,37,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--bd);box-shadow:0 20px 40px -12px rgba(0,0,0,.7);animation:aUp .42s cubic-bezier(.34,1.4,.64,1) .5s both;color:var(--tx)}
.dA .aRest .trk{stroke:rgba(255,255,255,.08)}
.dA .aRest .fil{stroke:#A5B4FC;transition:stroke-dashoffset 1s linear}
.dA .aRest>div{flex:1}
.dA .aRest span{display:block;font-size:11px;color:var(--mu);font-weight:600}
.dA .aRest b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.dA .aRest button{padding:8px 11px;border-radius:12px;background:rgba(255,255,255,.07);font-size:12.5px;font-weight:700}
.dA .aWarn{position:relative;padding:16px 14px 14px;margin:8px 0 18px;border-color:rgba(251,191,36,.32);background:linear-gradient(160deg,rgba(251,191,36,.15),rgba(255,255,255,.03))}
.dA .aTag{position:absolute;top:-9px;right:14px;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:#2A2410;color:#FCD34D;border:1px solid rgba(251,191,36,.35)}
.dA .aWarnTop{display:flex;gap:12px}
.dA .aWarnTop>.ic{color:var(--warn);margin-top:1px}
.dA .aWarnTop b{font-size:15px}
.dA .aWarnTop p{margin-top:4px;font-size:13px;color:#CBD0DC;line-height:1.45}
.dA .aWarnBtns{display:flex;gap:6px;margin:12px 0 0 30px}
.dA .aMiniCta{padding:9px 14px;border-radius:12px;background:var(--warn);color:#1A1300;font-weight:800;font-size:13px}
.dA .aMiniGhost{padding:9px 12px;font-size:13px;color:var(--mu);font-weight:700}
.dA .aTaken{margin:12px 0 0 30px;font-size:13px;color:#86EFAC;font-weight:700;align-items:center;gap:6px}
.dA .aSeg{display:inline-flex;padding:4px;border-radius:12px;background:var(--gl);border:1px solid var(--bd);gap:2px;margin:-8px 0 14px}
.dA .aSeg span{padding:6px 12px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--mu)}
.dA .aSeg .on{background:rgba(99,102,241,.32);color:#fff}
.dA .aBig{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;margin:0 2px 12px}
.dA .aBig b{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dA .aBig em{font-style:normal;font-size:13px;font-weight:800;color:var(--ok)}
.dA .aBig .cap{flex-basis:100%;font-size:13px;color:var(--mu);margin:0}
.dA .aChart{padding:12px 8px 6px;color:#9AA1B8}
.dA .aChart .hi{fill:#FCD34D;opacity:.9;font-weight:700}
.dA .aChart .hi2{fill:#C4B5FD;opacity:1;font-weight:700}
.dA .pulseDot{animation:pulse 1.8s ease-in-out 1.4s infinite;transform-box:fill-box;transform-origin:center}
.dA .aLegend{display:flex;gap:16px;margin:12px 4px 12px;font-size:12px;color:var(--mu);font-weight:600}
.dA .aLegend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.dA .aLegend .l1{background:linear-gradient(90deg,var(--a1),#A78BFA)}
.dA .aLegend .l2{background:repeating-linear-gradient(90deg,#C4B5FD 0 4px,transparent 4px 7px)}
.dA .aLegend .l3{height:10px;background:rgba(167,139,250,.28)}
.dA .aStats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dA .aStats .glass{padding:12px;border-radius:16px}
.dA .aStats b{display:block;font-size:17px;font-weight:800}
.dA .aStats span{font-size:11.5px;color:var(--mu)}
.dA .aFoot{font-size:12.5px;color:var(--mu);line-height:1.5;margin:14px 2px 0}
.dA .aVs{padding:18px 16px}

function spark(vals,col,w=130,h=18){const m=Math.max(...vals),mi=Math.min(...vals);return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${vals.map((v,i)=>n1(i/(vals.length-1)*w)+','+n1(h-2-(v-mi)/(m-mi||1)*(h-4))).join(' ')}" fill="none" stroke="${col}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`}

  <div class="ePanel st" style="--d:3"><div class="eRow"><span>03</span><b>DIPS</b><em>0/3</em><span>—</span></div><div class="eRow"><span>04</span><b>SEITHEBEN</b><em>0/4</em><span>—</span></div><div class="eRow"><span>05</span><b>TRIZEPSDRÜCKEN</b><em>0/3</em><span>—</span></div></div>
  <div class="ovl eRest"><span>REST</span><b data-timer>2:00</b><div class="eScale"><i data-tbar></i></div><button>+30</button><button>SKIP</button></div>`,
 kraft:()=>`<div class="eWarn st" style="--d:0" data-banner><span class="eTag">SZENARIO</span><b>⚠ 16 TAGE INAKTIV</b><p>EMPFEHLUNG −10 % → 74,0 KG (STATT 82,5)</p><button class="tk-hide" data-take>[ ÜBERNEHMEN ]</button><p class="eTaken tk-msg">✓ 74,0 KG GESETZT</p></div>
  <div class="ePanel st" style="--d:1"><div class="eHd"><span>BANKDRÜCKEN · E1RM</span><span>6M</span></div><div class="eBig"><b data-count="104.5" data-dec="1">104,5</b><span>KG</span><em>▲ +24,5 SEIT 02.06.</em></div>${eChart()}
   <div class="eModel"><span>MODELL</span><b>SÄTTIGUNG · P=112,0 · k=0,08/W</b><span>R²</span><b>0,94</b></div></div>
  <div class="eGrid st" style="--d:2"><div class="eTile"><span>PLATEAU</span><b>112,0</b><em>KG · ASYMPTOTE</em></div><div class="eTile"><span>RATE JETZT</span><b>+2,2</b><em>KG / MONAT</em></div><div class="eTile"><span>IN 12 WOCHEN</span><b>109,5</b><em>KG · ±4,2 (80 %)</em></div><div class="eTile"><span>STICHPROBE</span><b>16</b><em>EINHEITEN · 20 W</em></div></div>`,
 duell:()=>`<div class="eStat st" style="--d:0"><span>DUELL · KW 43</span><span>T−3 TAGE</span></div>
  <div class="ePanel st" style="--d:1"><div class="eHd"><span>VERGLEICH</span><span>DU / JONAS</span></div>${eCmp('LAST KG',18400,21050,0)}${eCmp('CARDIO KM',12.4,8.1,1)}${eCmp('EINHEITEN',3,4,0)}${eCmp('SÄTZE',41,52,0)}</div>
  <div class="ePanel st" style="--d:2"><div class="eHd"><span>VERLAUF WOCHE</span><span>KG KUMULIERT</span></div>${eCum()}</div>
  <div class="ePanel eShare st" style="--d:3"><div class="eHd"><span>AUSTAUSCH</span><span>OFFLINE · OHNE SERVER</span></div><div class="eCode"><span>DEIN CODE</span><b>REPZ-7K4Q-W9</b></div><div class="eCode"><span>JONAS</span><b>REPZ-J9QX-41</b><em>IMPORTIERT SO 12:04</em></div><button class="eCta" data-toast="Wochenkarte geteilt (Demo)">⇪ WOCHENKARTE TEILEN </button></div>`},
 tabs:()=>`<nav class="eTabs"><span class="eInd"></span>${TABS.map((t,i)=>`<button data-go="${t.k}"><b>0${i+1}</b>${t.l.toUpperCase()}</button>`).join('')}</nav>`};

const DIRS={a:A,b:B,c:C,d:D,e:E};
let cur='a',curScreen='heute',timerInt=null,autoT=null;
const screen=$('#screen');

function renderPicker(){
  $('#picker').innerHTML=Object.entries(DIRS).map(([k,d])=>`<div class="card" data-choice="${k}" onclick="pick(this)"><div class="sw">${d.sw.map(c=>`<i style="background:${c}"></i>`).join('')}</div><div><span class="pl">${k.toUpperCase()}</span><b>${d.name}</b></div></div>`).join('');
}
function pick(el){
  if(window.toggleSelect) window.toggleSelect(el);
  select(el.dataset.choice);
}
function renderInfo(k){const d=DIRS[k],keys=Object.keys(DIRS),i=keys.indexOf(k);
  $('#info').innerHTML=`<p class="kicker">Richtung ${k.toUpperCase()} von 5</p><h2>${d.name}</h2><p class="idea">${d.idea}</p><ul><li><b>Stärke</b>${d.pros}</li><li><b>Risiko</b>${d.risk}</li><li><b>Animation</b>${d.anim}</li></ul><p class="how">Im Handy unten durch die vier Bildschirme tippen. In „Einheit“ den Haken bei Satz 2 erneut antippen, um die Rekord-Animation zu wiederholen. In „Kraft“ „Übernehmen“ antippen.</p><div class="nav"><button onclick="step(-1)">← ${DIRS[keys[(i+4)%5]].name}</button><button onclick="step(1)">${DIRS[keys[(i+1)%5]].name} →</button></div>`;}
function step(dlt){const keys=Object.keys(DIRS);const k=keys[(keys.indexOf(cur)+dlt+5)%5];const el=$(`#picker [data-choice="${k}"]`);pick(el)}
function select(k){
  cur=k;const d=DIRS[k];
  $$('#picker .card').forEach(c=>c.classList.toggle('cur',c.dataset.choice===k));
  screen.className='screen d'+k.toUpperCase();
  screen.innerHTML=`<div class="sb"><span>18:42</span><span class="demo">Demo-Daten</span><span class="sbr">${batt()}</span></div><div class="scrs">${TABS.map(t=>`<section class="scr" data-s="${t.k}"></section>`).join('')}</div><div class="ovls"></div>${d.tabs()}`;
  renderInfo(k);show(curScreen);
}
function show(k){
  clearInterval(timerInt);clearTimeout(autoT);
  curScreen=k;const idx=TABS.findIndex(t=>t.k===k);screen.style.setProperty('--i',idx);
  const ov=$('.ovls',screen);ov.innerHTML='';
  $$('.scr',screen).forEach(s=>{s.classList.remove('active','in');if(s.dataset.s!==k)s.innerHTML=''});
  const s=$(`.scr[data-s="${k}"]`,screen);
  s.innerHTML=DIRS[cur].screens[k]();
  $$('.ovl',s).forEach(o=>ov.appendChild(o));
  s.classList.add('active');s.scrollTop=0;void s.offsetWidth;s.classList.add('in');
  screen.classList.remove('scan');void screen.offsetWidth;screen.classList.add('scan');
  $$('[data-go]',screen).forEach(b=>b.classList.toggle('on',b.dataset.go===k));
  countUps(screen);paint(120);
  if(k==='einheit')autoT=setTimeout(()=>{const r=$('[data-pr]:not(.on)',s);if(r)tick(r)},1500);
}
function tick(row){
  const on=!row.classList.contains('on');
  row.classList.toggle('on',on);row.classList.remove('pop');void row.offsetWidth;if(on)row.classList.add('pop');
  if(row.dataset.pr){
    row.classList.toggle('isPR',on);row.parentElement.classList.toggle('hasPR',on);
    const b=$('[data-prburst]',screen);
    if(b){b.classList.remove('show');void b.offsetWidth;if(on)b.classList.add('show')}
  }
  if(on)startTimer();
}
function startTimer(){clearInterval(timerInt);let rem=120;paint(rem);timerInt=setInterval(()=>{rem--;if(rem<0){clearInterval(timerInt);return}paint(rem)},1000)}
function paint(rem){
  $$('[data-timer]',screen).forEach(e=>e.textContent=Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0'));
  $$('[data-tbar]',screen).forEach(e=>e.style.transform=`scaleX(${rem/120})`);
  $$('[data-tring]',screen).forEach(e=>{const L=parseFloat(e.style.getPropertyValue('--len'));e.style.strokeDashoffset=(L*(1-rem/120)).toFixed(2)});
}
function countUps(root){
  $$('[data-count]',root).forEach(el=>{const to=parseFloat(el.dataset.count),dec=+(el.dataset.dec||0);
    if(reduce){el.textContent=fmt(to,dec);return}
    const t0=performance.now(),dur=760;
    const stepF=now=>{const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e,dec);if(p<1)requestAnimationFrame(stepF)};
    requestAnimationFrame(stepF);});
}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('.ovls',screen).appendChild(t);setTimeout(()=>t.remove(),2500)}
screen.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){show(g.dataset.go);return}
  const t=e.target.closest('[data-tick]');if(t){clearTimeout(autoT);tick(t.closest('[data-set]'));return}
  const tk=e.target.closest('[data-take]');if(tk){tk.closest('[data-banner]').classList.add('taken');return}
  const ts=e.target.closest('[data-toast]');if(ts)toast(ts.dataset.toast);
});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
const PW=399,PH=836;
function fit(){const stage=$('#stage'),cs=getComputedStyle(stage);const avail=stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);const s=Math.min(1,avail/PW,Math.max(.7,(innerHeight-28)/PH));
  const w=$('#phoneWrap');w.style.width=PW*s+'px';w.style.height=PH*s+'px';$('#phone').style.transform=`scale(${s})`}
addEventListener('resize',fit);
renderPicker();
function fromHash(){const m=location.hash.match(/^#([a-e])(?:-(heute|einheit|kraft|duell))?/);if(m){cur=m[1];if(m[2])curScreen=m[2]}}
addEventListener('hashchange',()=>{fromHash();select(cur)});
fromHash();select(cur);fit();
</script>
</body>
